name: Build-Test-Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install PowerShell
      uses: PowerShell/PowerShell-For-GitHub-Actions@v1

    - name: Lint & PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
        $results = Invoke-ScriptAnalyzer -Path ./SecureGen -Recurse
        if ($results) {
          $results | Format-Table
          exit 1
        }

    - name: Test Module
      shell: pwsh
      run: |
        Import-Module ./SecureGen/SecureGen.psd1 -Force
        Get-Module SecureGen | Select-Object ExportedCommands | ConvertTo-Json
        Write-Output "✅ Module SecureGen chargé !"

    - name: Pester Tests (if exists)
      shell: pwsh
      run: |
        if (Test-Path ./tests) {
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester -Path ./tests -Output Detailed -PassThru | ConvertTo-Json
        }

  publish:
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install PowerShell
      uses: PowerShell/PowerShell-For-GitHub-Actions@v1

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PS_GALLERY_API_KEY: ${{ secrets.PSGALLERY_KEY }}
      run: |
        $manifestPath = "./SecureGen/SecureGen.psd1"
        Publish-Module -Path (Split-Path $manifestPath) -NuGetApiKey $env:PS_GALLERY_API_KEY -Repository PSGallery