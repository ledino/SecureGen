# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Lint & PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
        $results = Invoke-ScriptAnalyzer -Path ./SecureGen -Recurse -Severity Error
        if ($results) { 
          $results | ConvertTo-Json
          echo "::error::PSScriptAnalyzer erreurs trouvées"
          exit 1 
        }
        echo "✅ PSScriptAnalyzer parfait !"

    - name: Test Module
      shell: pwsh
      run: |
        Import-Module ./SecureGen/SecureGen.psd1 -Force
        Get-Module SecureGen | Select-Object ExportedCommands | ConvertTo-Json
        echo "✅ Module SecureGen chargé !"

    - name: Pester Tests (if exists)
      shell: pwsh
      run: |
        if (Test-Path ./tests) {
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester -Path ./tests -Output Detailed -PassThru | ConvertTo-Json
        } else {
          echo "✅ Pas de tests Pester (dossier /tests absent)"
        }

  publish:
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PS_GALLERY_API_KEY: ${{ secrets.PSGALLERY_KEY }}
      run: |
        Publish-Module -Path ./SecureGen -NuGetApiKey $env:PS_GALLERY_API_KEY -Repository PSGallery
        echo "✅ SecureGen publié sur PSGallery !"
