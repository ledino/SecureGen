# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release SecureGen

on:
  workflow_dispatch:   # Lancement manuel
  push:
    tags:
      - 'v*'           # Lancement automatique sur tag

permissions:
  contents: write

jobs:
  release:
    name: Bump version + Changelog + Tag
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm ci

    - name: Run standard-version (bump + changelog + tag)
      run: npm run release

    - name: Push commit + tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git push --follow-tags origin main

  publish:
    name: Publish to PowerShell Gallery
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        $version = $tag.TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "Version détectée : $version"

    - name: Trust PSGallery
      shell: pwsh
      run: Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PSGALLERY_KEY: ${{ secrets.PSGALLERY_KEY }}
      run: |
        Publish-Module -Path ./SecureGen -NuGetApiKey $env:PSGALLERY_KEY -Repository PSGallery
        echo "SecureGen publié sur PSGallery !"
