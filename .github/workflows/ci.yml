name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        shell: ${{ matrix.shell }}
        run: |
          try {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
            $r = Invoke-ScriptAnalyzer ./SecureGen -Recurse -Severity Error
            if ($r) { $r | ConvertTo-Json; exit 1 }
          } catch { Write-Error $_; exit 1 }
      - name: Test Module
        shell: ${{ matrix.shell }}
        run: |
          Import-Module ./SecureGen/SecureGen.psd1 -Force
          echo "✅ $(matrix.shell) OK"

  publish:
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        shell: pwsh
        env:
          PS_GALLERY_API_KEY: ${{ secrets.PSGALLERY_KEY }}
        run: |
          Publish-Module ./SecureGen -NuGetApiKey $env:PS_GALLERY_API_KEY
