# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI PowerShell Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  tests:
    name: Tests ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            label: "PS 5.1 Windows"

          - os: windows-latest
            shell: pwsh
            label: "PS 7 Windows"

          - os: ubuntu-latest
            shell: pwsh
            label: "PS 7 Linux"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Trust PSGallery (non-interactive)
      shell: pwsh
      run: Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

    - name: Static Analysis (Lint)
      shell: pwsh
      run: |
        $results = Invoke-ScriptAnalyzer -Path ./SecureGen -Recurse -Severity Error
        if ($results) {
          $results | ConvertTo-Json
          exit 1
        }
        echo "Analyse statique OK"

    - name: Load Module
      shell: pwsh
      run: |
        Import-Module ./SecureGen/SecureGen.psd1 -Force
        echo "Module chargé"

    - name: Run Pester Tests (if exists)
      shell: pwsh
      run: |
        if (Test-Path ./tests) {
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester -Path ./tests -Output Detailed -EnableExit
        } else {
          echo "Aucun test Pester trouvé"
        }

  publish:
    name: Publish to PowerShell Gallery
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        $version = $tag.TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "Version détectée : $version"

    - name: Update ModuleVersion in manifest
      shell: pwsh
      run: |
        Update-ModuleManifest -Path ./SecureGen/SecureGen.psd1 -ModuleVersion $env:VERSION
        echo "Manifeste mis à jour avec la version $env:VERSION"

    - name: Install Ruby + Changelog Generator
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby-full build-essential
        sudo gem install github_changelog_generator

    #- name: Generate CHANGELOG.md
    #  env:
    #    CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #  run: |
    #    github_changelog_generator \
    #      --user ledino \
    #      --project SecureGen \
    #      --token $CHANGELOG_GITHUB_TOKEN \
    #      --exclude-labels "duplicate,question,invalid,wontfix"

    - name: Skip changelog generation (temporarily)
      run: echo "Changelog generation disabled due to Faraday/Ruby incompatibility"

    - name: Commit & Push manifest + changelog
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Automated version bump to ${{ steps.extract_version.outputs.version }} + changelog update" || echo "No changes to commit"
        git push origin HEAD:main

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PSGALLERY_KEY: ${{ secrets.PSGALLERY_KEY }}
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Publish-Module -Path ./SecureGen -NuGetApiKey $env:PSGALLERY_KEY -Repository PSGallery
        echo "SecureGen publié sur PSGallery !"
