name: CI PowerShell Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Tests ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: windows-latest
          shell: powershell
          label: "PS 5.1 Windows"
        - os: windows-latest
          shell: pwsh
          label: "PS 7 Windows"
        - os: ubuntu-latest
          shell: pwsh
          label: "PS 7 Linux"
    steps:
    - uses: actions/checkout@v4

    - name: PSScriptAnalyzer
      shell: ${{ matrix.shell }}
      run: |
        Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
        $results = Invoke-ScriptAnalyzer ./SecureGen -Recurse -Severity Error
        if ($results) { $results | ConvertTo-Json; exit 1 }

    - name: Test Module
      shell: ${{ matrix.shell }}
      run: |
        Import-Module ./SecureGen/SecureGen.psd1 -Force
        echo "✅ ${{ matrix.label }}"

  publish:
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Publish PSGallery
      shell: pwsh
      env:
        PS_GALLERY_API_KEY: ${{ secrets.PSGALLERY_KEY }}
      run: |
        Publish-Module ./SecureGen -NuGetApiKey $env:PS_GALLERY_API_KEY
