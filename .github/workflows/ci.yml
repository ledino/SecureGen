# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI PowerShell Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            label: "PS 5.1 Windows"

          - os: windows-latest
            shell: pwsh
            label: "PS 7 Windows"

          - os: ubuntu-latest
            shell: pwsh
            label: "PS 7 Linux"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Trust PSGallery (non-interactive)
      shell: pwsh
      run: Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

    - name: Static Analysis (Lint)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $results = Invoke-ScriptAnalyzer -Path ./SecureGen -Recurse -Severity Error
        if ($results) {
          $results | Format-List | Out-String
          exit 1
        }
        echo "Analyse statique OK"

    - name: Load Module
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module ./SecureGen/SecureGen.psd1 -Force
        echo "Module chargé"

    - name: Run Pester Tests (if exists)
      shell: pwsh
      run: |
        if (Test-Path ./tests) {
          Install-Module Pester -Force -Scope CurrentUser -ErrorAction Stop
          Invoke-Pester -Script ./tests --CI
        } else {
          echo "Aucun test Pester trouvé"
        }
